<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>بازی مترسک برنج یار</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:Tahoma, system-ui, sans-serif;
    background:linear-gradient(180deg,#fff8e1 0%,#ffe082 60%,#c8e6c9 100%);
    margin:0; padding:12px;
    padding-top:calc(12px + env(safe-area-inset-top));
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; min-height:100dvh;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  .header{
    background:rgba(255,255,255,.95); padding:10px 16px; border-radius:14px;
    box-shadow:0 6px 15px rgba(0,0,0,.08); text-align:center;
    width:100%; max-width:720px; border:2px solid #ffb74d;
  }
  .stats{ display:flex; justify-content:space-around; align-items:center; gap:8px; }
  .stat{ flex:1; }
  .stat-label{ font-size:11px; color:#666; }
  .stat-value{ font-size:20px; font-weight:bold; color:#e65100; font-variant-numeric:tabular-nums; }
  .actions{ margin-top:8px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .btn{
    padding:7px 12px; border-radius:10px; background:#e65100; color:#fff;
    border:0; font:inherit; font-weight:bold; font-size:14px; cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
  }
  .btn:active{ filter:brightness(.92); }
  .btn.secondary{ background:#ffe0b2; color:#5d4037; }

  .field{
    position:relative; width:100%; max-width:720px;
    flex:1 1 auto; min-height:0; margin:12px 0;
    border-radius:20px; overflow:hidden;
    background: radial-gradient(ellipse at 50% 0%, #b3e5fc 0%, #e1f5fe 40%, #e1f5fe 100%);
    border:2px solid #a5d6a7;
    box-shadow: inset 0 -30px 40px -20px rgba(76,175,80,.35);
  }
  .ground{
    position:absolute; left:0; right:0; bottom:0; height:38%;
    background:linear-gradient(180deg,#aed581 0%,#7cb342 60%,#558b2f 100%);
    border-top:3px solid #689f38;
  }
  .ground::before{
    content:''; position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 12px);
  }

  .scarecrow{
    position:absolute; left:50%; bottom:18%;
    transform:translateX(-50%);
    font-size:110px; line-height:1;
    cursor:pointer; background:none; border:0; padding:0; outline:none;
    transition:transform .08s ease;
    filter:drop-shadow(0 14px 18px rgba(0,0,0,.25));
    z-index:5;
    animation: sway 3s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ transform:translateX(-50%) rotate(-2deg); }
    50%{ transform:translateX(-50%) rotate(2deg); }
  }
  .scarecrow:active{ transform:translateX(-50%) scale(.9); animation:none; }

  .bird{
    position:absolute; font-size:44px; line-height:1; cursor:pointer;
    background:none; border:0; padding:0; outline:none;
    transition:transform .1s ease;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));
    z-index:8;
    animation: flap .6s ease-in-out infinite alternate;
  }
  @keyframes flap{
    from{ transform:scale(1) rotate(-4deg); }
    to  { transform:scale(1.05) rotate(4deg); }
  }
  .bird:active{ transform:scale(.8); }

  .floating-number{
    position:absolute; font-size:26px; font-weight:bold; color:#d84315;
    text-shadow:1px 1px 2px rgba(255,255,255,.8); pointer-events:none;
    animation:floatUp .9s ease-out forwards; z-index:20;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    70%{ transform:translateY(-60px) scale(1.1); }
    100%{ opacity:0; transform:translateY(-110px) scale(.9); }
  }

  .gameover{
    position:absolute; inset:0; background:rgba(0,0,0,.65);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:20px; z-index:50; gap:12px;
  }
  .gameover.show{ display:flex; }
  .gameover h2{ margin:0; font-size:26px; color:#ffcc80; }
  .gameover p{ margin:0; font-size:16px; }
  .footer{
    text-align:center; color:#5d4037; font-size:14px; font-weight:bold;
    background:rgba(255,255,255,.7); padding:8px 20px; border-radius:15px;
    width:100%; max-width:720px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="stats">
      <div class="stat">
        <div class="stat-label">مترسک یار کوین (SYC)</div>
        <div class="stat-value" id="coinCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">زمان</div>
        <div class="stat-value" id="timeCount">30</div>
      </div>
      <div class="stat">
        <div class="stat-label">دفع پرنده</div>
        <div class="stat-value" id="birdCount">0</div>
      </div>
    </div>
    <div class="actions">
      <a class="btn secondary" href="index.html">🏠 منو</a>
      <button class="btn" id="startBtn" type="button">شروع بازی</button>
      <button class="btn secondary" id="sendBtn" type="button">ارسال به ربات</button>
    </div>
  </div>

  <div class="field" id="field">
    <div class="ground"></div>
    <button class="scarecrow" id="scarecrow" type="button" aria-label="مترسک">🎃</button>

    <div class="gameover" id="gameover">
      <h2>پایان بازی!</h2>
      <p>امتیاز نهایی: <b id="finalScore">0</b> کوین</p>
      <p>پرنده‌های دفع‌شده: <b id="finalBirds">0</b></p>
      <button class="btn" id="againBtn" type="button">دوباره بازی کن</button>
    </div>
  </div>

  <div class="footer">مترسک رو لمس کن تا کوین بگیری و پرنده‌ها رو قبل از خوردن برنج دفع کن! 🐦🌾</div>

<script>
(function () {
  'use strict';

  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  const STORAGE_KEY = 'sycCoins_v1';

  const coinCountEl = document.getElementById('coinCount');
  const timeCountEl = document.getElementById('timeCount');
  const birdCountEl = document.getElementById('birdCount');
  const field       = document.getElementById('field');
  const scarecrow   = document.getElementById('scarecrow');
  const gameover    = document.getElementById('gameover');
  const finalScore  = document.getElementById('finalScore');
  const finalBirds  = document.getElementById('finalBirds');
  const startBtn    = document.getElementById('startBtn');
  const againBtn    = document.getElementById('againBtn');
  const sendBtn     = document.getElementById('sendBtn');

  let coins = 0, birdsDefeated = 0, timeLeft = 30;
  let playing = false;
  let timer = null, spawner = null;
  let totalCoins = 0;
  let saveTimer = null;

  function loadTotal() {
    try {
      totalCoins = Math.max(0, parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0);
    } catch (e) { totalCoins = 0; }
  }
  function saveTotal() {
    if (saveTimer) return;
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(STORAGE_KEY, String(totalCoins)); } catch (e) {}
      saveTimer = null;
    }, 300);
  }
  loadTotal();

  function updateHUD() {
    coinCountEl.textContent = coins;
    timeCountEl.textContent = Math.max(0, timeLeft);
    birdCountEl.textContent = birdsDefeated;
  }

  function floatNumber(x, y, text, color) {
    const rect = field.getBoundingClientRect();
    const f = document.createElement('div');
    f.className = 'floating-number';
    f.textContent = text;
    if (color) f.style.color = color;
    f.style.left = (x - rect.left - 12) + 'px';
    f.style.top  = (y - rect.top  - 30) + 'px';
    field.appendChild(f);
    setTimeout(function () { f.remove(); }, 900);
  }

  scarecrow.addEventListener('pointerdown', function (ev) {
    if (!playing) return;
    if (ev.isPrimary === false) return;
    ev.preventDefault();
    coins += 1;
    updateHUD();
    floatNumber(ev.clientX, ev.clientY, '+1', '#d84315');
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  });

  const BIRD_EMOJI = ['🐦', '🐦‍⬛', '🦅', '🕊️'];

  function spawnBird() {
    if (!playing) return;
    const bird = document.createElement('button');
    bird.className = 'bird';
    bird.type = 'button';
    bird.textContent = BIRD_EMOJI[Math.floor(Math.random() * BIRD_EMOJI.length)];

    const fieldRect = field.getBoundingClientRect();
    const startX = Math.random() * (fieldRect.width - 50);
    const startY = Math.random() * (fieldRect.height * 0.4);

    bird.style.left = startX + 'px';
    bird.style.top  = startY + 'px';

    let caught = false;
    bird.addEventListener('pointerdown', function (ev) {
      if (!playing || caught) return;
      if (ev.isPrimary === false) return;
      ev.preventDefault();
      caught = true;
      birdsDefeated += 1;
      coins += 3;
      updateHUD();
      floatNumber(ev.clientX, ev.clientY, '+3', '#1b5e20');
      bird.style.transform = 'scale(1.6) rotate(20deg)';
      bird.style.opacity = '0';
      setTimeout(function () { bird.remove(); }, 180);
      try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    });

    field.appendChild(bird);

    const dir = Math.random() < 0.5 ? 1 : -1;
    const speed = 40 + Math.random() * 60;
    let x = startX;
    const interval = setInterval(function () {
      if (!playing || caught) { clearInterval(interval); return; }
      x += dir * speed * 0.05;
      if (x < 0 || x > fieldRect.width - 50) {
        clearInterval(interval);
        bird.style.transition = 'opacity .3s';
        bird.style.opacity = '0';
        setTimeout(function () { bird.remove(); }, 300);
        return;
      }
      bird.style.left = x + 'px';
    }, 50);

    const life = 5000 + Math.random() * 3000;
    setTimeout(function () {
      if (caught) return;
      caught = true;
      bird.style.transition = 'opacity .3s, transform .3s';
      bird.style.opacity = '0';
      bird.style.transform = 'translateY(-30px)';
      setTimeout(function () { bird.remove(); }, 300);
    }, life);
  }

  function startGame() {
    field.querySelectorAll('.bird').forEach(function (b) { b.remove(); });
    field.querySelectorAll('.floating-number').forEach(function (f) { f.remove(); });

    coins = 0;
    birdsDefeated = 0;
    timeLeft = 30;
    playing = true;
    gameover.classList.remove('show');
    updateHUD();

    startBtn.textContent = 'در حال بازی...';
    startBtn.disabled = true;

    timer = setInterval(function () {
      timeLeft -= 1;
      updateHUD();
      if (timeLeft <= 0) endGame();
    }, 1000);

    let spawnDelay = 1600;
    function scheduleSpawn() {
      if (!playing) return;
      spawnBird();
      spawnDelay = Math.max(600, spawnDelay - 60);
      spawner = setTimeout(scheduleSpawn, spawnDelay);
    }
    spawner = setTimeout(scheduleSpawn, 800);
  }

  function endGame() {
    playing = false;
    clearInterval(timer);
    clearTimeout(spawner);
    field.querySelectorAll('.bird').forEach(function (b) {
      b.style.transition = 'opacity .3s';
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); }, 300);
    });
    field.querySelectorAll('.floating-number').forEach(function (f) { f.remove(); });

    totalCoins += coins;
    saveTotal();

    finalScore.textContent = coins;
    finalBirds.textContent = birdsDefeated;
    gameover.classList.add('show');

    startBtn.textContent = 'شروع بازی';
    startBtn.disabled = false;
  }

  startBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);

  sendBtn.addEventListener('click', function () {
    const payload = {
      type: 'scarecrow_game',
      roundCoins: coins,
      totalCoins: totalCoins,
      birdsDefeated: birdsDefeated,
      ts: Date.now()
    };
    if (tg && typeof tg.sendData === 'function') {
      try { tg.sendData(JSON.stringify(payload)); return; } catch (e) {}
    }
    alert('ارسال ممکن نشد. این دکمه فقط در مینی‌اپ تلگرام کار می‌کند.');
  });

})();
</script>
</body>
</html>
