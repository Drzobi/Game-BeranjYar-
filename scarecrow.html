<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>بازی مترسک برنج یار</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:Tahoma, system-ui, sans-serif;
    background:linear-gradient(180deg,#fff8e1 0%,#ffe082 60%,#c8e6c9 100%);
    margin:0; padding:12px;
    padding-top:calc(12px + env(safe-area-inset-top));
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; min-height:100dvh;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  .header{
    background:rgba(255,255,255,.95); padding:10px 16px; border-radius:14px;
    box-shadow:0 6px 15px rgba(0,0,0,.08); text-align:center;
    width:100%; max-width:720px; border:2px solid #ffb74d;
  }
  .stats{ display:flex; justify-content:space-around; align-items:center; gap:8px; }
  .stat{ flex:1; }
  .stat-label{ font-size:11px; color:#666; }
  .stat-value{ font-size:20px; font-weight:bold; color:#e65100; font-variant-numeric:tabular-nums; }
  .actions{ margin-top:8px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .btn{
    padding:7px 12px; border-radius:10px; background:#e65100; color:#fff;
    border:0; font:inherit; font-weight:bold; font-size:14px; cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
  }
  .btn:active{ filter:brightness(.92); }
  .btn.secondary{ background:#ffe0b2; color:#5d4037; }
  .btn:disabled{ opacity:0.6; cursor:not-allowed; }

  .field{
    position:relative; width:100%; max-width:720px;
    flex:1 1 auto; min-height:0; margin:12px 0;
    border-radius:20px; overflow:hidden;
    background: radial-gradient(ellipse at 50% 0%, #b3e5fc 0%, #e1f5fe 40%, #e1f5fe 100%);
    border:2px solid #a5d6a7;
    box-shadow: inset 0 -30px 40px -20px rgba(76,175,80,.35);
  }
  .ground{
    position:absolute; left:0; right:0; bottom:0; height:36%;
    background:linear-gradient(180deg,#aed581 0%,#7cb342 60%,#558b2f 100%);
    border-top:3px solid #689f38;
  }
  .ground::before{
    content:''; position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 12px);
  }

  .scarecrow-wrap{
    position:absolute; left:50%; bottom:11%;
    transform: translateX(-50%)l
    width:220px; height:310px;
    cursor:pointer; z-index:5;
    filter: drop-shadow(0 14px 18px rgba(0,0,0,.2l35));
    touch-action: manipulation;
  }
  .scarecrow-wrap svg{
    width:100%; height:100%; display:block;
    transform-origin: 50% 92%;
    animation: sway 3s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ transform: rotate(-2deg); }
    50%{ transform: rotate(2deg); }
  }
  .scarecrow-wrap.shaking svg{ animation: shake 0.45s ease-in-out; }
  @keyframes shake{
    0%{ transform: rotate(0deg); }
    15%{ transform: rotate(-20deg); }
    35%{ transform: rotate(18deg); }
    55%{ transform: rotate(-14deg); }
    75%{ transform: rotate(10deg); }
    100%{ transform: rotate(0deg); }
  }
  .scarecrow-wrap:active svg{ transform: scale(0.94); }

  .bird{
    position:absolute; font-size:38px; line-height:1;
    background:none; border:0; padding:0; outline:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));
    z-index:8; pointer-events:none;
    will-change: left, top, transform;
    transition: opacity 0.3s;
  }
  .bird.perched{ animation: perch-wobble 0.7s ease-in-out infinite; }
  @keyframes perch-wobble{
    0%,100%{ transform: rotate(-10deg) scale(1); }
    50%{ transform: rotate(10deg) scale(1.05); }
  }
  .bird.scared{ animation: scared-fly 0.55s ease-out forwards; }
  @keyframes scared-fly{
    0%{ transform: scale(1) rotate(0); opacity:1; }
    40%{ transform: scale(1.5) rotate(35deg); opacity:1; }
    100%{ transform: scale(0.5) rotate(-50deg) translateY(-80px); opacity:0; }
  }

  .floating-number{
    position:absolute; font-size:26px; font-weight:bold; color:#d84315;
    text-shadow:1px 1px 2px rgba(255,255,255,.9); pointer-events:none;
    animation:floatUp .9s ease-out forwards; z-index:20;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    70%{ transform:translateY(-60px) scale(1.15); }
    100%{ opacity:0; transform:translateY(-110px) scale(.85); }
  }

  .gameover{
    position:absolute; inset:0; background:rgba(0,0,0,.7);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:20px; z-index:50; gap:12px;
  }
  .gameover.show{ display:flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .gameover h2{ margin:0; font-size:26px; color:#ffcc80; }
  .gameover p{ margin:0; font-size:16px; }
  .gameover b{ color:#ffcc80; }

  .footer{
    text-align:center; color:#5d4037; font-size:14px; font-weight:bold;
    background:rgba(255,255,255,.7); padding:8px 20px; border-radius:15px;
    width:100%; max-width:720px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="stats">
      <div class="stat">
        <div class="stat-label">مترسک یار کوین (SYC)</div>
        <div class="stat-value" id="coinCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">زمان</div>
        <div class="stat-value" id="timeCount">30</div>
      </div>
      <div class="stat">
        <div class="stat-label">پرنده دفع‌شده</div>
        <div class="stat-value" id="birdCount">0</div>
      </div>
    </div>
    <div class="actions">
      <a class="btn secondary" href="index.html">🏠 منو</a>
      <button class="btn" id="startBtn" type="button">شروع بازی</button>
      <button class="btn secondary" id="sendBtn" type="button">ارسال به ربات</button>
    </div>
  </div>

  <div class="field" id="field">
    <div class="ground"></div>

    <div class="scarecrow-wrap" id="scarecrow" aria-label="مترسک">
      <svg viewBox="0 0 200 270" xmlns="http://www.w3.org/2000/svg">
        <rect x="22" y="125" width="156" height="11" fill="#8d6e63" rx="4"/>
        <rect x="94" y="80" width="12" height="180" fill="#8d6e63" rx="3"/>
        <path d="M 26 122 L 10 106 M 26 131 L 6 142 M 26 127 L 2 127"
              stroke="#fbc02d" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 174 122 L 190 106 M 174 131 L 194 142 M 174 127 L 198 127"
              stroke="#fbc02d" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 60 130 Q 52 212 66 226 L 134 226 Q 148 212 140 130 Z"
              fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
        <rect x="76" y="162" width="22" height="22" fill="#8d6e63" transform="rotate(8 87 173)"/>
        <rect x="105" y="188" width="18" height="18" fill="#5d4037" transform="rotate(-6 114 197)"/>
        <path d="M 66 226 L 56 250 M 79 226 L 73 254 M 91 226 L 87 256 M 103 226 L 99 256 M 115 226 L 119 254 M 128 226 L 138 250"
              stroke="#fbc02d" stroke-width="4" stroke-linecap="round" fill="none"/>
        <circle cx="100" cy="98" r="33" fill="#ffe0b2" stroke="#8d6e63" stroke-width="2"/>
        <ellipse cx="100" cy="70" rx="50" ry="11" fill="#8d6e63"/>
        <ellipse cx="100" cy="70" rx="50" ry="11" fill="none" stroke="#5d4037" stroke-width="1.5"/>
        <path d="M 72 70 L 78 30 Q 100 20 122 30 L 128 70 Z" fill="#795548"/>
        <rect x="72" y="64" width="56" height="10" fill="#d84315"/>
        <circle cx="88" cy="94" r="4.5" fill="#3e2723"/>
        <circle cx="112" cy="94" r="4.5" fill="#3e2723"/>
        <circle cx="89" cy="93" r="1.3" fill="#fff"/>
        <circle cx="113" cy="93" r="1.3" fill="#fff"/>
        <polygon points="100,102 95,111 105,111" fill="#e65100"/>
        <path d="M 84 116 Q 100 124 116 116" stroke="#3e2723" stroke-width="2.2"
              fill="none" stroke-dasharray="3,3" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="gameover" id="gameover">
      <h2>پایان بازی!</h2>
      <p>امتیاز نهایی: <b id="finalScore">0</b> کوین</p>
      <p>پرنده‌های دفع‌شده: <b id="finalBirds">0</b></p>
      <button class="btn" id="againBtn" type="button">دوباره بازی کن</button>
    </div>
  </div>

  <div class="footer">مترسک رو تکون بده تا پرنده‌ها از روی شونه‌ش بپرن! 🐦🌾</div>

<script>
(function () {
  'use strict';

  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  const STORAGE_KEY = 'sycCoins_v2';

  const coinCountEl = document.getElementById('coinCount');
  const timeCountEl = document.getElementById('timeCount');
  const birdCountEl = document.getElementById('birdCount');
  const field       = document.getElementById('field');
  const scarecrow   = document.getElementById('scarecrow');
  const gameover    = document.getElementById('gameover');
  const finalScore  = document.getElementById('finalScore');
  const finalBirds  = document.getElementById('finalBirds');
  const startBtn    = document.getElementById('startBtn');
  const againBtn    = document.getElementById('againBtn');
  const sendBtn     = document.getElementById('sendBtn');

  let coins = 0, birdsDefeated = 0, timeLeft = 30;
  let playing = false;
  let timer = null, spawner = null;
  let totalCoins = 0;
  let saveTimer = null;
  const activeBirds = new Set();

  /* ---------------- Audio Engine ---------------- */
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // صدای جیک‌جیک کوتاه پرنده عادی (زمانی که روی شاخه می‌شینه)
  function playBirdPerchSound() {
    const ctx = getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    for (let i = 0; i < 2; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1500, now + i*0.09);
      osc.frequency.exponentialRampToValueAtTime(2200, now + i*0.09 + 0.05);
      gain.gain.setValueAtTime(0.09, now + i*0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.09 + 0.07);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i*0.09);
      osc.stop(now + i*0.09 + 0.09);
    }
  }

  // صدای ترسیدن پرنده (جیک بلند + بال زدن)
  function playBirdScaredSound() {
    const ctx = getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;

    // جیک بلند
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1600 + i*200, now + i*0.06);
      osc.frequency.exponentialRampToValueAtTime(2800 + i*300, now + i*0.06 + 0.05);
      gain.gain.setValueAtTime(0.16, now + i*0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.06 + 0.07);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i*0.06);
      osc.stop(now + i*0.06 + 0.09);
    }

    // بال زدن (نویز سفید کوتاه)
    const bufferSize = ctx.sampleRate * 0.25;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.5);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.12, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 1200;
    noise.connect(filter).connect(noiseGain).connect(ctx.destination);
    noise.start(now);
    noise.stop(now + 0.3);
  }

  // صدای تکون دادن مترسک (خش‌خش چوبی + جیرجیر)
  function playShakeSound() {
    const ctx = getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;

    // خش‌خش چوبی (نویز فیلتردار)
    const bufferSize = ctx.sampleRate * 0.4;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 800;
    noiseFilter.Q.value = 0.8;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.18, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    noise.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.45);

    // جیرجیر چوبی
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(90, now + 0.35);
    gain.gain.setValueAtTime(0.14, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.42);
  }

  // صدای امتیاز گرفتن
  function playScoreSound() {
    const ctx = getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    const notes = [660, 880, 1100];
    notes.forEach(function (freq, i) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, now + i*0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.06 + 0.15);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i*0.06);
      osc.stop(now + i*0.06 + 0.18);
    });
  }

  /* ---------------- ذخیره‌سازی ---------------- */
  function loadTotal() {
    try { totalCoins = Math.max(0, parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0); }
    catch (e) { totalCoins = 0; }
  }
  function saveTotal() {
    if (saveTimer) return;
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(STORAGE_KEY, String(totalCoins)); } catch (e) {}
      saveTimer = null;
    }, 300);
  }
  loadTotal();

  function updateHUD() {
    coinCountEl.textContent = coins;
    timeCountEl.textContent = Math.max(0, timeLeft);
    birdCountEl.textContent = birdsDefeated;
  }

  function floatNumber(x, y, text, color) {
    const rect = field.getBoundingClientRect();
    const f = document.createElement('div');
    f.className = 'floating-number';
    f.textContent = text;
    if (color) f.style.color = color;
    f.style.left = (x - rect.left - 12) + 'px';
    f.style.top  = (y - rect.top  - 30) + 'px';
    field.appendChild(f);
    setTimeout(function () { f.remove(); }, 900);
  }

  /* ---------------- تکان مترسک ---------------- */
  let shakeTimeout = null;
  function shakeScarecrow() {
    if (!playing) return;

    scarecrow.classList.remove('shaking');
    void scarecrow.offsetWidth;
    scarecrow.classList.add('shaking');
    clearTimeout(shakeTimeout);
    shakeTimeout = setTimeout(function () {
      scarecrow.classList.remove('shaking');
    }, 500);

    // صدای تکون
    playShakeSound();

    // محدوده تکان
    const fieldRect = field.getBoundingClientRect();
    const scRect = scarecrow.getBoundingClientRect();
    const scCX = scRect.left + scRect.width / 2 - fieldRect.left;
    const scCY = scRect.top + scRect.height / 2 - fieldRect.top;
    const RANGE = 180;

    activeBirds.forEach(function (b) {
      if (b.scared) return;
      const bx = parseFloat(b.el.style.left) + 18;
      const by = parseFloat(b.el.style.top)  + 18;
      const dx = bx - scCX, dy = by - scCY;
      if (Math.sqrt(dx*dx + dy*dy) < RANGE) scareBird(b);
    });

    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
  }

  function scareBird(b) {
    if (b.scared) return;
    b.scared = true;
    birdsDefeated += 1;
    coins += 3;

    const rect = field.getBoundingClientRect();
    const bx = parseFloat(b.el.style.left) + 18;
    const by = parseFloat(b.el.style.top)  + 18;
    floatNumber(rect.left + bx, rect.top + by, '+3', '#1b5e20');

    b.el.classList.remove('perched', 'flying');
    b.el.classList.add('scared');
    updateHUD();

    playBirdScaredSound();
    playScoreSound();

    setTimeout(function () {
      b.el.remove();
      activeBirds.delete(b);
    }, 600);

    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  }

  scarecrow.addEventListener('pointerdown', function (ev) {
    if (ev.isPrimary === false) return;
    ev.preventDefault();
    if (!audioCtx) getAudioCtx();  // فعال‌سازی صدا با اولین لمس
    shakeScarecrow();
  });

  /* ---------------- ساخت پرنده ---------------- */
  const BIRD_EMOJI = ['🐦', '🐦‍⬛', '🦅', '🕊️'];

  function spawnBird() {
    if (!playing) return;
    const el = document.createElement('div');
    el.className = 'bird';
    el.textContent = BIRD_EMOJI[Math.floor(Math.random() * BIRD_EMOJI.length)];

    const fieldRect = field.getBoundingClientRect();
    const scRect = scarecrow.getBoundingClientRect();

    const edge = Math.floor(Math.random() * 4);
    let startX, startY;
    if (edge === 0) { startX = -50; startY = 60 + Math.random() * (fieldRect.height * 0.45); }
    else if (edge === 1) { startX = fieldRect.width + 50; startY = 60 + Math.random() * (fieldRect.height * 0.45); }
    else if (edge === 2) { startX = Math.random() * fieldRect.width; startY = -50; }
    else { startX = Math.random() * fieldRect.width; startY = fieldRect.height * 0.55; }

    const scCX = scRect.left + scRect.width / 2 - fieldRect.left;
    const scTopY = scRect.top - fieldRect.top;
    const targetX = scCX + (Math.random() - 0.5) * 80;
    const targetY = scTopY + 5 + Math.random() * 45;

    el.style.left = startX + 'px';
    el.style.top  = startY + 'px';
    field.appendChild(el);

    const b = { el: el, scared: false, startX: startX, startY: startY, targetX: targetX, targetY: targetY };
    activeBirds.add(b);

    const duration = 2000 + Math.random() * 1300;
    const startTime = performance.now();

    function animate(now) {
      if (b.scared) return;
      const p = Math.min((now - startTime) / duration, 1);
      const ep = 1 - Math.pow(1 - p, 3);
      el.style.left = (b.startX + (b.targetX - b.startX) * ep) + 'px';
      el.style.top  = (b.startY + (b.targetY - b.startY) * ep) + 'px';
      const ang = Math.atan2(b.targetY - b.startY, b.targetX - b.startX) * 180 / Math.PI;
      el.style.transform = 'rotate(' + (ang * 0.12) + 'deg)';

      if (p >= 1) {
        el.classList.add('perched');
        el.style.transform = '';
        playBirdPerchSound();
        setTimeout(function () {
          if (b.scared) return;
          b.scared = true;
          el.classList.remove('perched');
          el.classList.add('scared');
          setTimeout(function () { el.remove(); activeBirds.delete(b); }, 600);
        }, 4000);
      } else {
        requestAnimationFrame(animate);
      }
    }
    requestAnimationFrame(animate);
  }

  function startGame() {
    if (!audioCtx) getAudioCtx();
    activeBirds.forEach(function (b) { b.el.remove(); });
    activeBirds.clear();
    field.querySelectorAll('.bird').forEach(function (b) { b.remove(); });
    field.querySelectorAll('.floating-number').forEach(function (f) { f.remove(); });

    coins = 0; birdsDefeated = 0; timeLeft = 30; playing = true;
    gameover.classList.remove('show');
    updateHUD();

    startBtn.textContent = 'در حال بازی...';
    startB
