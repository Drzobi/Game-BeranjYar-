<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>بازی‌های برنج یار</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:Tahoma, system-ui, sans-serif;
    background: linear-gradient(160deg,#fff9c4 0%,#ffe082 35%,#a5d6a7 75%,#66bb6a 100%);
    background-size: 200% 200%;
    animation: bgShift 12s ease-in-out infinite;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top));
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    overflow:hidden;
    position:relative;
  }
  @keyframes bgShift{
    0%,100%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
  }

  /* ذرات شناور */
  .particles{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .particle{
    position:absolute; font-size:28px; opacity:0;
    animation: floatUpBg linear infinite;
    will-change: transform;
  }
  @keyframes floatUpBg{
    0%{ transform: translateY(105vh) rotate(0deg); opacity:0; }
    10%{ opacity:0.6; }
    90%{ opacity:0.6; }
    100%{ transform: translateY(-15vh) rotate(360deg); opacity:0; }
  }

  .content{
    position:relative; z-index:2;
    width:100%; max-width:400px;
    display:flex; flex-direction:column; align-items:center;
  }

  /* عنوان */
  .title{
    font-size:30px; font-weight:bold; color:#1b5e20;
    margin-bottom:6px; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:10px;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.7);
    animation: titleGlow 2.5s ease-in-out infinite;
    line-height:1.3;
  }
  @keyframes titleGlow{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 0px #ffd54f); }
    50%{ transform:scale(1.04); filter:drop-shadow(0 0 14px #ffd54f); }
  }
  .subtitle{
    color:#4a7a4a; font-size:13px; margin-bottom:24px; text-align:center;
    animation: fadeInDown 0.8s ease both;
  }
  @keyframes fadeInDown{
    from{ opacity:0; transform:translateY(-15px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .menu{ display:flex; flex-direction:column; gap:18px; width:100%; }

  /* کارت بازی */
  .game-card{
    position:relative; display:flex; flex-direction:row; align-items:center; gap:16px;
    background: linear-gradient(135deg, #ffffff 0%, #f1f8e9 100%);
    border-radius:22px; padding:18px 20px;
    text-decoration:none; color:#1b5e20;
    box-shadow: 0 12px 28px rgba(46,125,50,0.18), 0 3px 8px rgba(0,0,0,0.06);
    border:2px solid #c5e1a5;
    overflow:hidden;
    transform: translateY(50px); opacity: 0;
    animation: cardEnter 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    cursor:pointer;
  }
  .game-card:nth-child(1){ animation-delay: 0.2s; }
  .game-card:nth-child(2){ animation-delay: 0.4s; }

  @keyframes cardEnter{ to{ transform: translateY(0); opacity: 1; } }

  .game-card:active{
    transform: scale(0.96);
    box-shadow: 0 4px 12px rgba(46,125,50,0.3);
  }

  /* درخشش */
  .game-card::before{
    content:''; position:absolute; top:0; left:-100%;
    width:60%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3.5s ease-in-out infinite;
    animation-delay: 1s;
  }
  @keyframes shimmer{ 0%{ left:-100%; } 50%{ left:150%; } 100%{ left:150%; } }

  .card-svg{
    width:64px; height:64px; flex-shrink:0;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.18));
    animation: bounce 2.2s ease-in-out infinite;
  }
  .game-card:nth-child(2) .card-svg{ animation-delay: 0.5s; }
  @keyframes bounce{
    0%,100%{ transform: translateY(0) rotate(-3deg); }
    50%{ transform: translateY(-8px) rotate(3deg); }
  }

  .card-info{ display:flex; flex-direction:column; gap:4px; flex:1; text-align:right; }
  .card-info b{ font-size:17px; }
  .card-info small{ font-weight:normal; color:#6b6b6b; font-size:12.5px; }

  .card-arrow{
    font-size:18px; flex-shrink:0;
    animation: arrowMove 1.5s ease-in-out infinite;
  }
  @keyframes arrowMove{
    0%,100%{ transform: translateX(0); }
    50%{ transform: translateX(-6px); }
  }

  .game-card.rice{
    background: linear-gradient(135deg, #ffffff 0%, #fff8e1 100%);
    border-color:#ffe082;
  }
  .game-card.rice .card-arrow{ color:#f9a825; }

  .game-card.scarecrow{
    background: linear-gradient(135deg, #ffffff 0%, #ffe0b2 100%);
    border-color:#ffb74d;
  }
  .game-card.scarecrow .card-arrow{ color:#e65100; }

  .footer{
    margin-top:26px; color:#33691e; font-size:12.5px; text-align:center;
    animation: fadeInDown 1.2s ease both;
    animation-delay: 0.6s;
  }
  .footer .heart{
    display:inline-block;
    animation: heartBeat 1.2s ease-in-out infinite;
  }
  @keyframes heartBeat{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.35); } }

  /* دکمه صدا */
  .sound-btn{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); left:14px;
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.85); border:2px solid #a5d6a7;
    font-size:18px; cursor:pointer; z-index:30;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition: transform 0.15s ease;
  }
  .sound-btn:active{ transform:scale(0.9); }

  /* صفحه شروع (برای فعال شدن صدا) */
  .start-overlay{
    position:fixed; inset:0; z-index:100;
    background: linear-gradient(160deg, #1b5e20 0%, #2e7d32 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; color:#fff; text-align:center; padding:30px;
    transition: opacity 0.5s ease;
  }
  .start-overlay.hide{ opacity:0; pointer-events:none; }
  .start-overlay h1{ font-size:34px; margin:0; text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
  .start-overlay p{ font-size:14px; opacity:0.9; margin:0; }
  .start-btn{
    margin-top:16px;
    padding:14px 40px; font-size:18px; font-weight:bold;
    background:#ffd54f; color:#1b5e20; border:0; border-radius:50px;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    cursor:pointer; font-family:inherit;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform: scale(1); box-shadow:0 6px 20px rgba(0,0,0,0.25); }
    50%{ transform: scale(1.06); box-shadow:0 8px 28px rgba(255,213,79,0.5); }
  }
</style>
</head>
<body>

  <!-- صفحه شروع -->
  <div class="start-overlay" id="startOverlay">
    <div style="font-size:70px;">🌾</div>
    <h1>برنج یار</h1>
    <p>برای شروع، لمس کن</p>
    <button class="start-btn" id="startBtn" type="button">شروع ▶</button>
  </div>

  <!-- ذرات شناور -->
  <div class="particles" id="particles"></div>

  <!-- دکمه صدا -->
  <button class="sound-btn" id="soundBtn" type="button" aria-label="صدا">🔊</button>

  <div class="content">
    <h1 class="title">
      <span>🌾</span>
      برنج یار
      <span>🌾</span>
    </h1>
    <p class="subtitle">یکی از بازی‌ها رو انتخاب کن و شروع کن!</p>

    <div class="menu">
      <a class="game-card rice" href="rice.html" data-sound="rice">
        <svg class="card-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <!-- خوشه برنج طلایی -->
          <path d="M 32 58 L 32 24" stroke="#8d6e63" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <ellipse cx="32" cy="52" rx="5" ry="3" fill="#a5d6a7" opacity="0.7"/>
          <g fill="#fbc02d">
            <ellipse cx="26" cy="20" rx="4" ry="6.5" transform="rotate(-30 26 20)"/>
            <ellipse cx="38" cy="20" rx="4" ry="6.5" transform="rotate(30 38 20)"/>
            <ellipse cx="28" cy="28" rx="4" ry="6.5" transform="rotate(-25 28 28)"/>
            <ellipse cx="36" cy="28" rx="4" ry="6.5" transform="rotate(25 36 28)"/>
            <ellipse cx="30" cy="36" rx="4" ry="6.5" transform="rotate(-20 30 36)"/>
            <ellipse cx="34" cy="36" rx="4" ry="6.5" transform="rotate(20 34 36)"/>
            <ellipse cx="32" cy="14" rx="4" ry="6" transform="rotate(0 32 14)"/>
          </g>
          <g fill="#fdd835">
            <ellipse cx="27" cy="24" rx="2.5" ry="4" transform="rotate(-30 27 24)"/>
            <ellipse cx="37" cy="24" rx="2.5" ry="4" transform="rotate(30 37 24)"/>
            <ellipse cx="32" cy="18" rx="2.5" ry="4"/>
          </g>
          <circle cx="32" cy="14" r="1.5" fill="#fff9c4"/>
        </svg>
        <span class="card-info">
          <b>بازی شالیزار برنج یار</b>
          <small>شالیزار رو لمس کن و کوین جمع کن</small>
        </span>
        <span class="card-arrow">◀</span>
      </a>

      <a class="game-card scarecrow" href="scarecrow.html" data-sound="scarecrow">
        <svg class="card-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <!-- مترسک کوچک -->
          <rect x="8" y="30" width="48" height="3" fill="#8d6e63" rx="1.5"/>
          <rect x="30" y="20" width="4" height="42" fill="#8d6e63" rx="1"/>
          <!-- کاه دست چپ و راست -->
          <path d="M 10 30 L 4 26 M 10 32 L 3 34" stroke="#fbc02d" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M 54 30 L 60 26 M 54 32 L 61 34" stroke="#fbc02d" stroke-width="1.5" stroke-linecap="round"/>
          <!-- پیراهن -->
          <path d="M 22 33 Q 19 50 22 54 L 42 54 Q 45 50 42 33 Z" fill="#ef6c00" stroke="#bf360c" stroke-width="1"/>
          <rect x="27" y="40" width="6" height="6" fill="#8d6e63" transform="rotate(10 30 43)"/>
          <!-- کاه پایین -->
          <path d="M 22 54 L 19 61 M 27 54 L 25 62 M 33 54 L 33 62 M 38 54 L 40 62 M 42 54 L 45 61"
                stroke="#fbc02d" stroke-width="1.5" stroke-linecap="round"/>
          <!-- سر -->
          <circle cx="32" cy="26" r="9" fill="#ffe0b2" stroke="#8d6e63" stroke-width="1"/>
          <!-- کلاه -->
          <ellipse cx="32" cy="18" rx="14" ry="3" fill="#8d6e63"/>
          <path d="M 24 18 L 26 8 Q 32 5 38 8 L 40 18 Z" fill="#795548"/>
          <rect x="24" y="15" width="16" height="3" fill="#d84315"/>
          <!-- چشم‌ها -->
          <circle cx="29" cy="25" r="1.3" fill="#3e2723"/>
          <circle cx="35" cy="25" r="1.3" fill="#3e2723"/>
          <path d="M 28 31 Q 32 33 36 31" stroke="#3e2723" stroke-width="0.8" fill="none" stroke-dasharray="1.5,1.5"/>
        </svg>
        <span class="card-info">
          <b>بازی مترسک برنج یار</b>
          <small>مترسک رو تکون بده و پرنده‌ها رو بپرون</small>
        </span>
        <span class="card-arrow">◀</span>
      </a>
    </div>

    <div class="footer">
      ساخته شده با <span class="heart">💚</span> برای کشاورزان دیجیتال
    </div>
  </div>

<script>
(function () {
  'use strict';

  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  /* ---------- Audio Engine ---------- */
  let audioCtx = null;
  let musicPlaying = false;
  let musicTimeout = null;
  let soundEnabled = true;

  function getAudioCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  /* ---------- صدای لمس کارت ---------- */
  function playTapSound() {
    if (!soundEnabled) return;
    const ctx = getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.16);
  }

  /* ---------- موسیقی پس‌زمینه ریتمیک ---------- */
  function playMusicNote(freq, duration, type, volume) {
    const ctx = getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(volume || 0.08, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.05);
  }

  // ملودی شاد پنتاتونیک
  const melody = [
    { n: 523.25, d: 0.35 }, { n: 659.25, d: 0.35 }, { n: 783.99, d: 0.45 },
    { n: 659.25, d: 0.35 }, { n: 880.00, d: 0.5 },
    { n: 783.99, d: 0.35 }, { n: 659.25, d: 0.35 }, { n: 587.33, d: 0.45 },
    { n: 523.25, d: 0.55 },
    { n: 440.00, d: 0.35 }, { n: 523.25, d: 0.35 }, { n: 659.25, d: 0.45 },
    { n: 587.33, d: 0.35 }, { n: 523.25, d: 0.6 }
  ];
  let melodyIndex = 0;

  function playMusicLoop() {
    if (!musicPlaying) return;
    const note = melody[melodyIndex % melody.length];
    playMusicNote(note.n, note.d, 'triangle', 0.07);
    // بیس ملایم
    if (melodyIndex % 4 === 0) {
      playMusicNote(note.n / 4, 0.4, 'sine', 0.05);
    }
    melodyIndex++;
    musicTimeout = setTimeout(playMusicLoop, note.d * 1000 + 60);
  }

  function startMusic() {
    if (musicPlaying || !soundEnabled) return;
    const ctx = getAudioCtx(); if (!ctx) return;
    musicPlaying = true;
    melodyIndex = 0;
    playMusicLoop();
  }

  function stopMusic() {
    musicPlaying = false;
    if (musicTimeout) { clearTimeout(musicTimeout); musicTimeout = null; }
  }

  /* ---------- ذرات شناور پس‌زمینه ---------- */
  const particleEmojis = ['🌾','🎃','🐦','🌱','🌿','✨','💚','🌾','🍃','⭐','🌾','🐦'];
  const particlesBox = document.getElementById('particles');
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = particleEmojis[Math.floor(Math.random() * particleEmojis.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.fontSize = (20 + Math.random() * 22) + 'px';
    p.style.animationDuration = (9 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 12) + 's';
    particlesBox.appendChild(p);
  }

  /* ---------- دکمه شروع (فعال‌سازی صدا) ---------- */
  const startOverlay = document.getElementById('startOverlay');
  const startBtnEl = document.getElementById('startBtn');
  startBtnEl.addEventListener('click', function () {
    getAudioCtx();
    startOverlay.classList.add('hide');
    startMusic();
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
  });

  /* ---------- لمس کارت‌ها + صدای مخصوص ---------- */
  document.querySelectorAll('.game-card').forEach(function (card) {
    card.addEventListener('pointerdown', function (ev) {
      if (ev.isPrimary === false) return;
      playTapSound();
      try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('heavy'); } catch (e) {}

      // صدای مخصوص هر بازی
      const type = card.getAttribute('data-sound');
      if (type === 'scarecrow') {
        // صدای پرنده
        setTimeout(function () {
          const ctx = getAudioCtx(); if (!ctx) return;
          const now = ctx.currentTime;
          for (let i = 0; i < 3; i++) {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(1400 + i*300, now + i*0.07);
            o.frequency.exponentialRampToValueAtTime(2600 + i*300, now + i*0.07 + 0.05);
            g.gain.setValueAtTime(0.12, now + i*0.07);
            g.gain.exponentialRampToValueAtTime(0.001, now + i*0.07 + 0.08);
            o.connect(g).connect(ctx.destination);
            o.start(now + i*0.07);
            o.stop(now + i*0.07 + 0.1);
          }
        }, 80);
      }
    });
  });

  /* ---------- دکمه صدا ---------- */
  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', function (ev) {
    ev.preventDefault();
    ev.stopPropagation();
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      soundBtn.textContent = '🔊';
      startMusic();
      playTapSound();
    } else {
      soundBtn.textContent = '🔇';
      stopMusic();
    }
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  });

  /* ---------- توقف صدا وقتی از صفحه خارج می‌شویم ---------- */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') stopMusic();
    else if (soundEnabled) startMusic();
  });

})();
</script>
</body>
</html>
