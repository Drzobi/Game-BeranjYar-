<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>برنج‌یار | BeranjYar</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* مدار و دایره چرخان انیمیشنی */
    .radar-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed #f59e0b;
      animation: spin 16s linear infinite;
    }

    .orbit-dot {
      position: absolute;
      top: -6px;
      left: calc(50% - 6px);
      width: 12px;
      height: 12px;
      background-color: #facc15;
      border-radius: 50%;
      box-shadow: 0 0 12px #facc15, 0 0 20px #eab308;
    }

    .logo-center {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #059669, #047857);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(5, 150, 105, 0.4);
      z-index: 2;
    }

    .logo-center svg {
      width: 52px;
      height: 52px;
      fill: #fef08a;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* عنوان سامانه */
    .brand-title {
      font-size: 2rem;
      font-weight: 900;
      color: #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 1.05rem;
      color: #e2e8f0;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .brand-en {
      font-size: 0.85rem;
      color: #fbbf24;
      letter-spacing: 4px;
      font-weight: 700;
      margin-bottom: 32px;
    }

    /* لیست دکمه‌ها */
    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-card {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 20px;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease;
      cursor: pointer;
    }

    .btn-card:active {
      transform: scale(0.97);
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: right;
    }

    .btn-icon {
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-texts {
      display: flex;
      flex-direction: column;
    }

    .btn-main-text {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .btn-sub-text {
      font-size: 0.78rem;
      opacity: 0.85;
      margin-top: 2px;
      font-weight: 400;
    }

    .arrow-icon {
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* رنگ‌بندی دقیق دکمه‌ها بر اساس طرح اولیه */
    .btn-orange {
      background: linear-gradient(90deg, #f59e0b, #d97706);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
    }

    .btn-green {
      background: linear-gradient(90deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.35);
    }

    .btn-blue {
      background: linear-gradient(90deg, #0ea5e9, #0284c7);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
    }

    .footer {
      margin-top: 40px;
      font-size: 0.78rem;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- دایره و مدار انیمیشنی چرخان به همراه لوگو در مرکز -->
    <div class="radar-wrapper">
      <div class="orbit">
        <div class="orbit-dot"></div>
      </div>
      <div class="logo-center">
        <!-- نماد خوشه برنج طلایی -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2C9.5 5 7 8.5 7 12.5C7 16 9.5 19 12 21C14.5 19 17 16 17 12.5C17 8.5 14.5 5 12 2ZM12 18.5C10.5 17 8.8 14.8 8.8 12.5C8.8 9.8 10.7 7 12 4.8C13.3 7 15.2 9.8 15.2 12.5C15.2 14.8 13.5 17 12 18.5Z"/>
        </svg>
      </div>
    </div>

    <!-- عنوان و هویت برنج‌یار -->
    <div class="brand-title">
      <span>🌾</span>
      <span>برنج یار</span>
      <span>🌾</span>
    </div>
    <div class="brand-subtitle">دستیار هوشمند شالیکاران</div>
    <div class="brand-en">BERANJYAR</div>

    <!-- دکمه‌های ۳ گانه بدون تداخل و بدون کادر سیاه -->
    <div class="button-group">
      
      <!-- دکمه اول: دانلود اپلیکیشن -->
      <a href="beranjyar.apk" download class="btn-card btn-orange">
        <div class="btn-content">
          <div class="btn-icon">📱</div>
          <div class="btn-texts">
            <span class="btn-main-text">دانلود اپلیکیشن شالیکار</span>
            <span class="btn-sub-text">نسخه اندروید - فایل نصبی APK</span>
          </div>
        </div>
        <div class="arrow-icon">◀</div>
      </a>

      <!-- دکمه دوم: نسخه وب و بازی -->
      <a href="#" class="btn-card btn-green" onclick="alert('نسخه وب‌اپلیکیشن به زودی فعال خواهد شد.'); return false;">
        <div class="btn-content">
          <div class="btn-icon">🎮</div>
          <div class="btn-texts">
            <span class="btn-main-text">ورود به شبیه‌ساز مزرعه</span>
            <span class="btn-sub-text">نسخه وب - بدون نیاز به نصب</span>
          </div>
        </div>
        <div class="arrow-icon">◀</div>
      </a>

      <!-- دکمه سوم: تلگرام -->
      <a href="https://t.me/beranjyarbot" target="_blank" class="btn-card btn-blue">
        <div class="btn-content">
          <div class="btn-icon">🤖</div>
          <div class="btn-texts">
            <span class="btn-main-text">ربات و کانال تلگرام</span>
            <span class="btn-sub-text">@beranjyarbot</span>
          </div>
        </div>
        <div class="arrow-icon">◀</div>
      </a>

    </div>

    <div class="footer">
      © سامانه هوشمند برنج‌یار - مازندران
    </div>

  </div>

</body>
</html>
