<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>بازی مترسک برنج یار</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:Tahoma, system-ui, sans-serif;
    background:#1b5e20;
    padding:10px;
    padding-top:calc(10px + env(safe-area-inset-top));
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; min-height:100dvh;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }

  /* ============ هدر ============ */
  .header{
    background:rgba(255,255,255,.95); padding:8px 14px; border-radius:14px;
    box-shadow:0 6px 15px rgba(0,0,0,.2); text-align:center;
    width:100%; max-width:720px; border:2px solid #ffb74d;
    z-index:100;
  }
  .stats{ display:flex; justify-content:space-around; align-items:center; gap:6px; }
  .stat{ flex:1; }
  .stat-label{ font-size:10px; color:#666; font-weight:bold; }
  .stat-value{ font-size:20px; font-weight:bold; color:#e65100; font-variant-numeric:tabular-nums; }

  /* ============ مزرعه ============ */
  .field{
    position:relative; width:100%; max-width:720px;
    flex:1 1 auto; min-height:0; margin:10px 0;
    border-radius:20px; overflow:hidden;
    border:3px solid #8d6e63;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
    cursor:default;
  }

  /* آسمان */
  .sky{
    position:absolute; top:0; left:0; right:0; bottom:55%;
    background: linear-gradient(180deg,#4fc3f7 0%,#81d4fa 45%,#b3e5fc 75%,#e1f5fe 100%);
  }
  /* خورشید */
  .sun{
    position:absolute; top:8%; right:8%;
    width:60px; height:60px; border-radius:50%;
    background: radial-gradient(circle,#fff59d 0%,#ffeb3b 55%,#fbc02d 100%);
    box-shadow: 0 0 30px 10px rgba(255,235,59,.6), 0 0 60px 20px rgba(255,193,7,.35);
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.06); }
  }
  /* ابرها */
  .cloud{
    position:absolute; background:#fff; border-radius:50px;
    opacity:.85; filter: blur(0.3px);
    animation: cloudMove linear infinite;
  }
  .cloud::before, .cloud::after{
    content:''; position:absolute; background:#fff; border-radius:50%;
  }
  .cloud::before{ width:60%; height:120%; top:-50%; left:10%; }
  .cloud::after{ width:50%; height:100%; top:-35%; right:10%; }
  @keyframes cloudMove{
    from{ transform: translateX(-150px); }
    to{ transform: translateX(calc(100vw + 150px)); }
  }

  /* تپه‌های دور */
  .hills{
    position:absolute; left:0; right:0; bottom:45%; height:60px;
    background: radial-gradient(ellipse 45% 100% at 20% 100%, #81c784 0%, #81c784 70%, transparent 72%),
                radial-gradient(ellipse 55% 100% at 60% 100%, #aed581 0%, #aed581 70%, transparent 72%),
                radial-gradient(ellipse 40% 100% at 90% 100%, #81c784 0%, #81c784 70%, transparent 72%);
  }

  /* نرده چوبی */
  .fence{
    position:absolute; left:0; right:0; bottom:52%; height:22px;
    display:flex; justify-content:space-around; align-items:center;
  }
  .fence::before{
    content:''; position:absolute; left:0; right:0; top:50%;
    height:3px; background:#8d6e63; transform: translateY(-50%);
  }
  .fence-post{
    width:5px; height:22px; background:#6d4c41;
    border-radius:2px 2px 0 0;
    box-shadow: inset -1px 0 0 rgba(0,0,0,.2);
  }

  /* زمین مزرعه */
  .farm{
    position:absolute; left:0; right:0; bottom:0; height:55%;
    background: linear-gradient(180deg,#c5e1a5 0%,#aed581 12%,#8bc34a 40%,#689f38 100%);
  }
  /* شیارهای مزرعه */
  .farm::before{
    content:''; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 12px, rgba(0,0,0,.06) 12px 14px),
      repeating-linear-gradient(180deg, transparent 0 8px, rgba(255,255,255,.04) 8px 10px);
    pointer-events:none;
  }
  /* خوشه‌های برنج روی زمین */
  .farm::after{
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 8% 20%, #fbc02d 0 3px, transparent 3px),
      radial-gradient(circle at 15% 45%, #f9a825 0 3px, transparent 3px),
      radial-gradient(circle at 22% 75%, #fbc02d 0 3px, transparent 3px),
      radial-gradient(circle at 30% 30%, #f9a825 0 3px, transparent 3px),
      radial-gradient(circle at 38% 65%, #fbc02d 0 3px, transparent 3px),
      radial-gradient(circle at 46% 25%, #f9a825 0 3px, transparent 3px),
      radial-gradient(circle at 54% 80%, #fbc02d 0 3px, transparent 3px),
      radial-gradient(circle at 62% 40%, #f9a825 0 3px, transparent 3px),
      radial-gradient(circle at 70% 70%, #fbc02d 0 3px, transparent 3px),
      radial-gradient(circle at 78% 22%, #f9a825 0 3px, transparent 3px),
      radial-gradient(circle at 86% 55%, #fbc02d 0 3px, transparent 3px),
      radial-gradient(circle at 94% 78%, #f9a825 0 3px, transparent 3px);
    background-size: 100% 100%;
    pointer-events:none;
    opacity:.75;
  }

  /* مترسک */
  .scarecrow-wrap{
    position:absolute; left:50%; bottom:14%;
    transform: translateX(-50%);
    width:150px; height:210px;
    cursor:pointer; z-index:5;
    filter: drop-shadow(0 14px 18px rgba(0,0,0,.35));
    touch-action: manipulation;
  }
  .scarecrow-wrap svg{
    width:100%; height:100%; display:block;
    transform-origin: 50% 92%;
    animation: sway 3s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ transform: rotate(-2deg); }
    50%{ transform: rotate(2deg); }
  }
  .scarecrow-wrap.shaking svg{ animation: shake 0.45s ease-in-out; }
  @keyframes shake{
    0%{ transform: rotate(0deg); }
    15%{ transform: rotate(-20deg); }
    35%{ transform: rotate(18deg); }
    55%{ transform: rotate(-14deg); }
    75%{ transform: rotate(10deg); }
    100%{ transform: rotate(0deg); }
  }
  .scarecrow-wrap.inactive{ opacity:.35; pointer-events:none; filter: grayscale(.5) drop-shadow(0 14px 18px rgba(0,0,0,.35)); }

  /* پرنده‌ها */
  .bird{
    position:absolute; font-size:40px; line-height:1;
    user-select:none; pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));
    z-index:8;
    will-change: left, top, transform;
  }
  .bird.perched{ animation: perch-wobble 0.7s ease-in-out infinite; }
  @keyframes perch-wobble{
    0%,100%{ transform: rotate(-10deg) scale(1); }
    50%{ transform: rotate(10deg) scale(1.05); }
  }
  .bird.scared{ animation: scared-fly 0.55s ease-out forwards; }
  @keyframes scared-fly{
    0%{ transform: scale(1) rotate(0); opacity:1; }
    40%{ transform: scale(1.5) rotate(35deg); opacity:1; }
    100%{ transform: scale(0.5) rotate(-50deg) translateY(-80px); opacity:0; }
  }

  /* اعداد شناور */
  .floating-number{
    position:absolute; font-size:28px; font-weight:bold; color:#1b5e20;
    text-shadow:1px 1px 3px rgba(255,255,255,1); pointer-events:none;
    animation:floatUp .9s ease-out forwards; z-index:20;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    70%{ transform:translateY(-60px) scale(1.15); }
    100%{ opacity:0; transform:translateY(-110px) scale(.85); }
  }

  /* ============ دکمه‌های روی مزرعه ============ */
  .overlay{
    position:absolute; inset:0; z-index:60;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px; padding:20px;
    background: rgba(0,0,0,.25);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .overlay.hidden{ display:none; }

  .overlay-title{
    font-size:22px; font-weight:bold; color:#fff;
    text-shadow:0 3px 8px rgba(0,0,0,.5);
    text-align:center; margin-bottom:4px;
  }
  .overlay-sub{
    font-size:14px; color:#fff; opacity:.9;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
    text-align:center;
  }

  .big-btn{
    padding:16px 42px;
    font-size:20px; font-weight:bold;
    background: linear-gradient(135deg,#ffb300 0%,#f57c00 100%);
    color:#fff; border:0; border-radius:50px;
    box-shadow:0 8px 22px rgba(245,124,0,.5), inset 0 -3px 0 rgba(0,0,0,.15);
    cursor:pointer; font-family:inherit;
    transition: transform .1s ease, box-shadow .2s ease;
    text-shadow:0 1px 3px rgba(0,0,0,.3);
    animation: bigPulse 2s ease-in-out infinite;
  }
  .big-btn:active{ transform:scale(.95); box-shadow:0 4px 12px rgba(245,124,0,.5); }
  @keyframes bigPulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.04); }
  }

  .big-btn.green{
    background: linear-gradient(135deg,#66bb6a 0%,#2e7d32 100%);
    box-shadow:0 8px 22px rgba(46,125,50,.5), inset 0 -3px 0 rgba(0,0,0,.15);
  }
  .big-btn.red{
    background: linear-gradient(135deg,#ef5350 0%,#c62828 100%);
    box-shadow:0 8px 22px rgba(198,40,40,.5), inset 0 -3px 0 rgba(0,0,0,.15);
  }

  /* دکمه‌های گوشه */
  .corner-actions{
    position:absolute; top:10px; left:10px; right:10px;
    display:flex; justify-content:space-between; z-index:15;
    pointer-events:none;
  }
  .corner-actions > *{ pointer-events:auto; }

  .corner-btn{
    padding:8px 14px; font-size:13px; font-weight:bold;
    background: rgba(255,255,255,.92); color:#5d4037;
    border:2px solid #ffb74d; border-radius:12px;
    cursor:pointer; font-family:inherit;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    display:none;
  }
  .corner-btn:active{ transform:scale(.94); }

  /* ============ پایان بازی ============ */
  .gameover{
    position:absolute; inset:0; background:rgba(0,0,0,.78);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:24px; z-index:70; gap:14px;
  }
  .gameover.show{ display:flex; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .gameover h2{ font-size:28px; color:#ffcc80; }
  .gameover .score-row{
    display:flex; flex-direction:column; gap:6px;
    background: rgba(255,255,255,.1); border-radius:16px;
    padding:16px 30px; border:2px solid rgba(255,204,128,.3);
  }
  .gameover .score-row p{ font-size:15px; }
  .gameover b{ color:#ffcc80; font-size:22px; }

  /* ============ فوتر ============ */
  .footer{
    text-align:center; color:#fff; font-size:13px; font-weight:bold;
    background:rgba(0,0,0,.35); padding:8px 20px; border-radius:15px;
    width:100%; max-width:720px;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
  }

  @media (max-width: 400px){
    .overlay-title{ font-size:18px; }
    .big-btn{ padding:14px 34px; font-size:17px; }
    .scarecrow-wrap{ width:130px; height:182px; }
  }
</style>
</head>
<body>

  <!-- هدر با شمارنده‌ها -->
  <div class="header">
    <div class="stats">
      <div class="stat">
        <div class="stat-label">🪙 کوین</div>
        <div class="stat-value" id="coinCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">⏱ زمان</div>
        <div class="stat-value" id="timeCount">30</div>
      </div>
      <div class="stat">
        <div class="stat-label">🐦 دفع‌شده</div>
        <div class="stat-value" id="birdCount">0</div>
      </div>
    </div>
  </div>

  <!-- مزرعه -->
  <div class="field" id="field">

    <!-- آسمان -->
    <div class="sky">
      <div class="sun"></div>
      <div class="cloud" style="width:70px;height:22px;top:10%;left:5%;animation-duration:45s;"></div>
      <div class="cloud" style="width:90px;height:26px;top:22%;left:60%;animation-duration:60s;animation-delay:-15s;"></div>
      <div class="cloud" style="width:55px;height:18px;top:5%;left:35%;animation-duration:50s;animation-delay:-30s;"></div>
    </div>

    <!-- تپه‌ها -->
    <div class="hills"></div>

    <!-- نرده -->
    <div class="fence" id="fence"></div>

    <!-- مزرعه -->
    <div class="farm"></div>

    <!-- مترسک -->
    <div class="scarecrow-wrap" id="scarecrow" aria-label="مترسک">
      <svg viewBox="0 0 200 270" xmlns="http://www.w3.org/2000/svg">
        <rect x="22" y="125" width="156" height="11" fill="#8d6e63" rx="4"/>
        <rect x="94" y="80" width="12" height="180" fill="#8d6e63" rx="3"/>
        <path d="M 26 122 L 10 106 M 26 131 L 6 142 M 26 127 L 2 127"
              stroke="#fbc02d" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 174 122 L 190 106 M 174 131 L 194 142 M 174 127 L 198 127"
              stroke="#fbc02d" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 60 130 Q 52 212 66 226 L 134 226 Q 148 212 140 130 Z"
              fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
        <rect x="76" y="162" width="22" height="22" fill="#8d6e63" transform="rotate(8 87 173)"/>
        <rect x="105" y="188" width="18" height="18" fill="#5d4037" transform="rotate(-6 114 197)"/>
        <path d="M 66 226 L 56 250 M 79 226 L 73 254 M 91 226 L 87 256 M 103 226 L 99 256 M 115 226 L 119 254 M 128 226 L 138 250"
              stroke="#fbc02d" stroke-width="4" stroke-linecap="round" fill="none"/>
        <circle cx="100" cy="98" r="33" fill="#ffe0b2" stroke="#8d6e63" stroke-width="2"/>
        <ellipse cx="100" cy="70" rx="50" ry="11" fill="#8d6e63"/>
        <ellipse cx="100" cy="70" rx="50" ry="11" fill="none" stroke="#5d4037" stroke-width="1.5"/>
        <path d="M 72 70 L 78 30 Q 100 20 122 30 L 128 70 Z" fill="#795548"/>
        <rect x="72" y="64" width="56" height="10" fill="#d84315"/>
        <circle cx="88" cy="94" r="4.5" fill="#3e2723"/>
        <circle cx="112" cy="94" r="4.5" fill="#3e2723"/>
        <circle cx="89" cy="93" r="1.3" fill="#fff"/>
        <circle cx="113" cy="93" r="1.3" fill="#fff"/>
        <polygon points="100,102 95,111 105,111" fill="#e65100"/>
        <path d="M 84 116 Q 100 124 116 116" stroke="#3e2723" stroke-width="2.2"
              fill="none" stroke-dasharray="3,3" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- دکمه‌های گوشه (پایان بازی) -->
    <div class="corner-actions">
      <button class="corner-btn" id="stopBtn" type="button">⏹ پایان</button>
      <button class="corner-btn" id="soundBtn" type="button">🔊</button>
    </div>

    <!-- صفحه شروع -->
    <div class="overlay" id="startOverlay">
      <div class="overlay-title">🌾 برنج یار 🌾</div>
      <div class="overlay-sub">مترسک رو تکون بده تا پرنده‌ها بپرن!</div>
      <button class="big-btn" id="startBtn" type="button">▶ شروع بازی</button>
    </div>

    <!-- پایان بازی -->
    <div class="gameover" id="gameover">
      <h2>🎉 پایان بازی!</h2>
      <div class="score-row">
        <p>امتیاز این دور: <b id="finalScore">0</b> کوین</p>
        <p>پرنده‌های دفع‌شده: <b id="finalBirds">0</b></p>
      </div>
      <button class="big-btn green" id="againBtn" type="button">🔄 دوباره بازی کن</button>
      <button class="big-btn red" id="sendBtn" type="button">📤 ارسال به ربات</button>
    </div>

  </div>

  <div class="footer">مترسک رو تکون بده تا پرنده‌های اطرافش بپرن! 🐦🌾</div>

<script>
(function () {
  'use strict';

  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  const STORAGE_KEY = 'syc_total_v1';

  const coinCountEl = document.getElementById('coinCount');
  const timeCountEl = document.getElementById('timeCount');
  const birdCountEl = document.getElementById('birdCount');
  const field       = document.getElementById('field');
  const fence       = document.getElementById('fence');
  const scarecrow   = document.getElementById('scarecrow');
  const gameover    = document.getElementById('gameover');
  const startOverlay= document.getElementById('startOverlay');
  const finalScore  = document.getElementById('finalScore');
  const finalBirds  = document.getElementById('finalBirds');
  const startBtn    = document.getElementById('startBtn');
  const stopBtn     = document.getElementById('stopBtn');
  const againBtn    = document.getElementById('againBtn');
  const sendBtn     = document.getElementById('sendBtn');
  const soundBtn    = document.getElementById('soundBtn');

  let coins = 0, birdsDefeated = 0, timeLeft = 30;
  let playing = false;
  let timer = null, spawner = null;
  let totalCoins = 0;
  let soundEnabled = true;
  const activeBirds = [];

  /* ============ ساخت نرده‌ها ============ */
  (function buildFence(){
    const N = 14;
    for (let i = 0; i < N; i++) {
      const post = document.createElement('div');
      post.className = 'fence-post';
      fence.appendChild(post);
    }
  })();

  /* ============ Audio ============ */
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
    return audioCtx;
  }

  function playBirdChirp() {
    if (!soundEnabled) return;
    const ctx = getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    for (let i = 0; i < 2; i++) {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1500 + i*200, now + i*0.09);
      osc.frequency.exponentialRampToValueAtTime(2400 + i*200, now + i*0.09 + 0.05);
      gain.gain.setValueAtTime(0.08, now + i*0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.09 + 0.08);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i*0.09);
      osc.stop(now + i*0.09 + 0.1);
    }
  }

  function playScaredSound() {
    if (!soundEnabled) return;
    const ctx = getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1600 + i*250, now + i*0.05);
      osc.frequency.exponentialRampToValueAtTime(3000 + i*300, now + i*0.05 + 0.05);
      gain.gain.setValueAtTime(0.12, now + i*0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.05 + 0.08);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i*0.05);
      osc.stop(now + i*0.05 + 0.1);
    }
  }

  function playShakeSound() {
    if (!soundEnabled) return;
    const ctx = getAudioCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    const bufferSize = Math.floor(ctx.sampleRate * 0.4);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.3);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 800; filter.Q.value = 0.8;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.14, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.45);

    const osc = ctx.createOscillator(), g2 = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(90, now + 0.35);
    g2.gain.setValueAtTime(0.10, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(g2).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.42);
  }

  function playScoreSound() {
    if (!soundEnabled) return;
    const ctx = getAudioCtx(
