<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>مترسک برنج یار</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,sans-serif;background:#1b5e20;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.header{background:#fff;padding:8px 14px;border-radius:14px;text-align:center;width:100%;max-width:720px;border:2px solid #ffb74d;display:flex;justify-content:space-around;gap:6px}
.stat{flex:1}
.stat b{display:block;font-size:10px;color:#666}
.stat span{font-size:20px;font-weight:bold;color:#e65100}
.field{position:relative;width:100%;max-width:720px;flex:1;min-height:0;margin:10px 0;border-radius:20px;overflow:hidden;border:3px solid #8d6e63;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.sky{position:absolute;top:0;left:0;right:0;bottom:55%;background:linear-gradient(#4fc3f7,#81d4fa 45%,#e1f5fe)}
.sun{position:absolute;top:8%;right:8%;width:55px;height:55px;border-radius:50%;background:radial-gradient(circle,#fff59d,#ffeb3b 55%,#fbc02d);box-shadow:0 0 30px 10px rgba(255,235,59,.6)}
.hills{position:absolute;left:0;right:0;bottom:45%;height:60px;background:radial-gradient(ellipse 45% 100% at 20% 100%,#81c784 70%,transparent 72%),radial-gradient(ellipse 55% 100% at 60% 100%,#aed581 70%,transparent 72%),radial-gradient(ellipse 40% 100% at 90% 100%,#81c784 70%,transparent 72%)}
.fence{position:absolute;left:0;right:0;bottom:52%;height:22px;display:flex;justify-content:space-around;align-items:center}
.fence:before{content:'';position:absolute;left:0;right:0;top:50%;height:3px;background:#8d6e63;transform:translateY(-50%)}
.fence-post{width:5px;height:22px;background:#6d4c41;border-radius:2px 2px 0 0}
.farm{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(#c5e1a5,#aed581 12%,#8bc34a 40%,#689f38)}
.scarecrow{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:250px;height:320px;cursor:pointer;z-index:5;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35));touch-action:manipulation}
.scarecrow svg{width:100%;height:100%;display:block;transform-origin:50% 92%;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.scarecrow.shaking svg{animation:shake .45s}
@keyframes shake{0%{transform:rotate(0)}15%{transform:rotate(-20deg)}35%{transform:rotate(18deg)}55%{transform:rotate(-14deg)}75%{transform:rotate(10deg)}100%{transform:rotate(0)}}
.scarecrow.inactive{opacity:.4;pointer-events:none}
pappapapapa.bird{position:absolute;font-size:40px;line-height:1;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));z-index:8;will-change:left,top,transform}
.bird.perched{animation:pw .7s ease-in-out infinite}
@keyframes pw{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) scale(1.05)}}
.bird.scared{animation:sf .55s ease-out forwards}
@keyframes sf{0%{transform:scale(1);opacity:1}40%{transform:scale(1.5) rotate(35deg);opacity:1}100%{transform:scale(.5) rotate(-50deg) translateY(-80px);opacity:0}}
.float{position:absolute;font-size:28px;font-weight:bold;color:#1b5e20;text-shadow:1px 1px 3px #fff;pointer-events:none;animation:fu .9s ease-out forwards;z-index:20}
@keyframes fu{0%{opacity:1;transform:translateY(0)}70%{transform:translateY(-60px) scale(1.15)}100%{opacity:0;transform:translateY(-110px) scale(.85)}}
.overlay{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(0,0,0,.3);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.overlay.hidden{display:none}
.otitle{font-size:22px;font-weight:bold;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.5);text-align:center}
.osub{font-size:14px;color:#fff;opacity:.9;text-align:center}
.bigbtn{padding:16px 42px;font-size:20px;font-weight:bold;background:linear-gradient(135deg,#ffb300,#f57c00);color:#fff;border:0;border-radius:50px;box-shadow:0 8px 22px rgba(245,124,0,.5);cursor:pointer;font-family:inherit;text-shadow:0 1px 3px rgba(0,0,0,.3);animation:bp 2s ease-in-out infinite}
.bigbtn:active{transform:scale(.95)}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.bigbtn.green{background:linear-gradient(135deg,#66bb6a,#2e7d32);box-shadow:0 8px 22px rgba(46,125,50,.5)}
.corner{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:15;pointer-events:none}
.corner>button{pointer-events:auto;padding:8px 14px;font-size:13px;font-weight:bold;background:rgba(255,255,255,.92);color:#5d4037;border:2px solid #ffb74d;border-radius:12px;cursor:pointer;font-family:inherit;display:none}
.corner>button:active{transform:scale(.94)}
.gameover{position:absolute;inset:0;background:rgba(0,0,0,.78);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;z-index:70;gap:14px}
.gameover.show{display:flex}
.gameover h2{font-size:28px;color:#ffcc80}
.gameover .row{background:rgba(255,255,255,.1);border-radius:16px;padding:16px 30px;border:2px solid rgba(255,204,128,.3)}
.gameover p{font-size:15px;margin:4px 0}
.gameover b{color:#ffcc80;font-size:22px}
.footer{text-align:center;color:#fff;font-size:13px;font-weight:bold;background:rgba(0,0,0,.35);padding:8px 20px;border-radius:15px;width:100%;max-width:720px}
</style>
</head><body>

<div class="header">
<div class="stat"><b>🪙 کوین</b><span id="coinCount">0</span></div>
<div class="stat"><b>⏱ زمان</b><span id="timeCount">30</span></div>
<div class="stat"><b>🐦 دفع‌شده</b><span id="birdCount">0</span></div>
</div>

<div class="field" id="field">
<div class="sky"><div class="sun"></div></div>
<div class="hills"></div>
<div class="fence" id="fence"></div>
<div class="farm"></div>

<div class="scarecrow inactive" id="scarecrow">
<svg viewBox="0 0 200 270" xmlns="http://www.w3.org/2000/svg">
<rect x="22" y="125" width="156" height="11" fill="#8d6e63" rx="4"/>
<rect x="94" y="80" width="12" height="180" fill="#8d6e63" rx="3"/>
<path d="M26 122L10 106M26 131L6 142M26 127L2 127" stroke="#fbc02d" stroke-width="4" stroke-linecap="round" fill="none"/>
<path d="M174 122L190 106M174 131L194 142M174 127L198 127" stroke="#fbc02d" stroke-width="4" stroke-linecap="round" fill="none"/>
<path d="M60 130Q52 212 66 226L134 226Q148 212 140 130Z" fill="#ef6c00" stroke="#bf360c" stroke-width="2"/>
<rect x="76" y="162" width="22" height="22" fill="#8d6e63" transform="rotate(8 87 173)"/>
<rect x="105" y="188" width="18" height="18" fill="#5d4037" transform="rotate(-6 114 197)"/>
<path d="M66 226L56 250M79 226L73 254M91 226L87 256M103 226L99 256M115 226L119 254M128 226L138 250" stroke="#fbc02d" stroke-width="4" stroke-linecap="round" fill="none"/>
<circle cx="100" cy="98" r="33" fill="#ffe0b2" stroke="#8d6e63" stroke-width="2"/>
<ellipse cx="100" cy="70" rx="50" ry="11" fill="#8d6e63"/>
<path d="M72 70L78 30Q100 20 122 30L128 70Z" fill="#795548"/>
<rect x="72" y="64" width="56" height="10" fill="#d84315"/>
<circle cx="88" cy="94" r="4.5" fill="#3e2723"/>
<circle cx="112" cy="94" r="4.5" fill="#3e2723"/>
<circle cx="89" cy="93" r="1.3" fill="#fff"/>
<circle cx="113" cy="93" r="1.3" fill="#fff"/>
<polygon points="100,102 95,111 105,111" fill="#e65100"/>
<path d="M84 116Q100 124 116 116" stroke="#3e2723" stroke-width="2.2" fill="none" stroke-dasharray="3,3" stroke-linecap="round"/>
</svg>
</div>

<div class="corner">
<button id="soundBtn">🔊</button>
<button id="stopBtn">⏹ پایان</button>
</div>

<div class="overlay" id="startOverlay">
<div class="otitle">🌾 برنج یار 🌾</div>
<div class="osub">مترسک رو تکون بده تا پرنده‌ها بپرن!</div>
<button class="bigbtn" id="startBtn">▶ شروع بازی</button>
</div>

<div class="gameover" id="gameover">
<h2>🎉 پایان بازی!</h2>
<div class="row">
<p>امتیاز این دور: <b id="finalScore">0</b></p>
<p>پرنده‌های دفع‌شده: <b id="finalBirds">0</b></p>
</div>
<button class="bigbtn green" id="againBtn">🔄 دوباره بازی کن</button>
<button class="bigbtn" id="sendBtn">📤 ارسال به ربات</button>
</div>
</div>

<div class="footer">مترسک رو تکون بده تا پرنده‌های اطرافش بپرن! 🐦🌾</div><script>
(function(){
'use strict';
var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
var K='syc_total_v1';
var ce=document.getElementById('coinCount'),te=document.getElementById('timeCount'),be=document.getElementById('birdCount');
var F=document.getElementById('field'),SC=document.getElementById('scarecrow');
var GO=document.getElementById('gameover'),SO=document.getElementById('startOverlay');
var fs=document.getElementById('finalScore'),fb=document.getElementById('finalBirds');
var SB=document.getElementById('startBtn'),STB=document.getElementById('stopBtn'),AB=document.getElementById('againBtn');
var SENDB=document.getElementById('sendBtn'),SNDB=document.getElementById('soundBtn');
var fence=document.getElementById('fence');
for(var i=0;i<14;i++){var p=document.createElement('div');p.className='fence-post';fence.appendChild(p)}
var coins=0,birds=0,timeLeft=30,playing=false,timer=null,spawner=null,total=0,soundEnabled=true;
var activeBirds=[];
try{total=Math.max(0,parseInt(localStorage.getItem(K)||'0',10)||0)}catch(e){total=0}
var AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function birdChirp(){if(!soundEnabled)return;var c=ac();if(!c)return;var n=c.currentTime;
for(var i=0;i<2;i++){var o=c.createOscillator(),g=c.createGain();o.type='sine';
o.frequency.setValueAtTime(1500+i*200,n+i*0.09);
o.frequency.exponentialRampToValueAtTime(2400+i*200,n+i*0.09+0.05);
g.gain.setValueAtTime(0.08,n+i*0.09);g.gain.exponentialRampToValueAtTime(0.001,n+i*0.09+0.08);
o.connect(g).connect(c.destination);o.start(n+i*0.09);o.stop(n+i*0.09+0.1)}}
function scaredSound(){if(!soundEnabled)return;var c=ac();if(!c)return;var n=c.currentTime;
for(var i=0;i<3;i++){var o=c.createOscillator(),g=c.createGain();o.type='sine';
o.frequency.setValueAtTime(1600+i*250,n+i*0.05);
o.frequency.exponentialRampToValueAtTime(3000+i*300,n+i*0.05+0.05);
g.gain.setValueAtTime(0.12,n+i*0.05);g.gain.exponentialRampToValueAtTime(0.001,n+i*0.05+0.08);
o.connect(g).connect(c.destination);o.start(n+i*0.05);o.stop(n+i*0.05+0.1)}}
function shakeSound(){if(!soundEnabled)return;var c=ac();if(!c)return;var n=c.currentTime;
var bs=Math.floor(c.sampleRate*0.4),buf=c.createBuffer(1,bs,c.sampleRate),d=buf.getChannelData(0);
for(var i=0;i<bs;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/bs,1.3);
var src=c.createBufferSource();src.buffer=buf;
var fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.value=800;fl.Q.value=0.8;
var g=c.createGain();g.gain.setValueAtTime(0.14,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.4);
src.connect(fl).connect(g).connect(c.destination);src.start(n);src.stop(n+0.45);
var o=c.createOscillator(),g2=c.createGain();o.type='sawtooth';
o.frequency.setValueAtTime(180,n);o.frequency.exponentialRampToValueAtTime(90,n+0.35);
g2.gain.setValueAtTime(0.10,n);g2.gain.exponentialRampToValueAtTime(0.001,n+0.4);
o.connect(g2).connect(c.destination);o.start(n);o.stop(n+0.42)}
function scoreSound(){if(!soundEnabled)return;var c=ac();if(!c)return;var n=c.currentTime;
[660,880,1100].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;
g.gain.setValueAtTime(0.10,n+i*0.06);g.gain.exponentialRampToValueAtTime(0.001,n+i*0.06+0.15);
o.connect(g).connect(c.destination);o.start(n+i*0.06);o.stop(n+i*0.06+0.18)})}
function upd(){ce.textContent=coins;te.textContent=Math.max(0,timeLeft);be.textContent=birds}
function flt(x,y,txt,col){var r=F.getBoundingClientRect();var f=document.createElement('div');
f.className='float';f.textContent=txt;if(col)f.style.color=col;
f.style.left=(x-r.left-14)+'px';f.style.top=(y-r.top-30)+'px';
F.appendChild(f);setTimeout(function(){f.remove()},900)}
var shkTO=null;
function shake(cx,cy){
if(!playing)return;
SC.classList.remove('shaking');void SC.offsetWidth;SC.classList.add('shaking');
clearTimeout(shkTO);shkTO=setTimeout(function(){SC.classList.remove('shaking')},500);
shakeSound();
coins+=1;upd();
if(cx!==undefined)flt(cx,cy,'+1','#d84315');
var sR=SC.getBoundingClientRect(),scx=sR.left+sR.width/2,scy=sR.top+sR.height/2,R=200;
for(var i=activeBirds.length-1;i>=0;i--){var b=activeBirds[i];if(b.scared)continue;
var dx=b.ax-scx,dy=b.ay-scy;if(Math.sqrt(dx*dx+dy*dy)<R)scare(b)}
try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('medium')}catch(e){}}
function scare(b){if(b.scared)return;b.scared=true;birds+=1;coins+=3;
flt(b.ax,b.ay,'+3','#1b5e20');
b.el.classList.remove('perched');b.el.classList.add('scared');upd();
scaredSound();scoreSound();
setTimeout(function(){b.el.remove();var i=activeBirds.indexOf(b);if(i>=0)activeBirds.splice(i,1)},600);
try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}}
SC.addEventListener('pointerdown',function(e){if(e.isPrimary===false)return;e.preventDefault();ac();shake(e.clientX,e.clientY)});
var BIRDS=['🐦','🐦','🦅','🕊️','🐧'];
function spawnBird(){
if(!playing)return;
var fR=F.getBoundingClientRect();if(!fR.width)return;
var sR=SC.getBoundingClientRect();
var el=document.createElement('div');el.className='bird';
el.textContent=BIRDS[Math.floor(Math.random()*BIRDS.length)];
var edge=Math.floor(Math.random()*4),sx,sy;
if(edge===0){sx=-60;sy=40+Math.random()*(fR.height*0.5)}
else if(edge===1){sx=fR.width+60;sy=40+Math.random()*(fR.height*0.5)}
else if(edge===2){sx=Math.random()*fR.width;sy=-60}
else{sx=Math.random()*fR.width;sy=fR.height*0.6}
var scx=sR.left-fR.left+sR.width/2,scy=sR.top-fR.top;
var tx=scx+(Math.random()-0.5)*90,ty=scy+10+Math.random()*50;
el.style.left=sx+'px';el.style.top=sy+'px';
F.appendChild(el);
var b={el:el,scared:false,sx:sx,sy:sy,tx:tx,ty:ty,ax:0,ay:0};
activeBirds.push(b);
var dur=2200+Math.random()*1200,t0=performance.now();
function anim(now){
if(b.scared)return;
var p=Math.min((now-t0)/dur,1),ep=1-Math.pow(1-p,3);
var cx=b.sx+(b.tx-b.sx)*ep,cy=b.sy+(b.ty-b.sy)*ep;
el.style.left=cx+'px';el.style.top=cy+'px';
b.ax=fR.left+cx+20;b.ay=fR.top+cy+20;
var ang=Math.atan2(b.ty-b.sy,b.tx-b.sx)*180/Math.PI;
el.style.transform='rotate('+(ang*0.12)+'deg)';
if(p>=1){el.classList.add('perched');el.style.transform='';birdChirp();
setTimeout(function(){if(b.scared)return;b.scared=true;
el.classList.remove('perched');el.classList.add('scared');
setTimeout(function(){el.remove();var i=activeBirds.indexOf(b);if(i>=0)activeBirds.splice(i,1)},600)},4000)}
else requestAnimationFrame(anim)}
requestAnimationFrame(anim)}
function startGame(){
ac();
activeBirds.forEach(function(b){b.el.remove()});activeBirds.length=0;
F.querySelectorAll('.bird').forEach(function(b){b.remove()});
F.querySelectorAll('.float').forEach(function(f){f.remove()});
coins=0;birds=0;timeLeft=30;playing=true;
GO.classList.remove('show');SO.classList.add('hidden');
SC.classList.remove('inactive');
upd();
STB.style.display='block';SNDB.style.display='block';
timer=setInterval(function(){timeLeft-=1;upd();if(timeLeft<=0)endGame()},1000);
spawnBird();
var d=1500;
function loop(){if(!playing)return;spawnBird();if(Math.random()<0.3)spawnBird();
d=Math.max(550,d-80);spawner=setTimeout(loop,d)}
spawner=setTimeout(loop,1200)}
function endGame(){
if(!playing)return;playing=false;
clearInterval(timer);clearTimeout(spawner);
activeBirds.forEach(function(b){if(!b.scared){b.scared=true;b.el.style.transition='opacity .4s';b.el.style.opacity='0'}});
setTimeout(function(){activeBirds.forEach(function(b){b.el.remove()});activeBirds.length=0},500);
total+=coins;try{localStorage.setItem(K,String(total))}catch(e){}
STB.style.display='none';SC.classList.add('inactive');
fs.textContent=coins;fb.textContent=birds;GO.classList.add('show')}
SB.addEventListener('click',startGame);
AB.addEventListener('click',startGame);
STB.addEventListener('click',endGame);
SNDB.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
soundEnabled=!soundEnabled;SNDB.textContent=soundEnabled?'🔊':'🔇'});
SENDB.addEventListener('click',function(){
var p={type:'scarecrow_game',roundCoins:coins,totalCoins:total,birdsDefeated:birds,ts:Date.now()};
if(tg&&typeof tg.sendData==='function'){try{tg.sendData(JSON.stringify(p));return}catch(e){}}
alert('ارسال ممکن نشد')});
})();
</script>
</body>
</html>
