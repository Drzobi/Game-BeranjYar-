<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برنج یار | BeranjYar</title>
    <!-- استفاده از فونت استاندارد وب فارسی -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0a0f18 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* بخش لوگو و انیمیشن ظریف نوری */
        .logo-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .dashed-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed #f59e0b;
            border-radius: 50%;
            animation: rotateCircle 25s linear infinite;
        }

        @keyframes rotateCircle {
            100% { transform: rotate(360deg); }
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
        }

        /* تایپوگرافی عنوان */
        .title {
            font-size: 1.9rem;
            font-weight: 800;
            color: #facc15;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(250, 204, 21, 0.2);
        }

        .subtitle {
            font-size: 1.05rem;
            color: #cbd5e1;
            font-weight: 400;
            margin-bottom: 6px;
        }

        .brand-en {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: #f59e0b;
            font-weight: 700;
            margin-bottom: 35px;
        }

        /* استایل دکمه‌های ناوبری */
        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-card {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .btn-card:active {
            transform: scale(0.97);
        }

        .btn-card .arrow {
            font-size: 1.2rem;
            opacity: 0.7;
        }

        .btn-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            flex-grow: 1;
            margin: 0 15px;
        }

        .btn-title {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .btn-subtitle {
            font-size: 0.8rem;
            opacity: 0.85;
            margin-top: 2px;
        }

        .btn-icon {
            font-size: 1.8rem;
        }

        /* تم رنگی اختصاصی هر دکمه مطابق اسکرین‌شات */
        .btn-download {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #1e1b18;
        }

        .btn-game {
            background: linear-gradient(135deg, #2dd4bf, #0d9488);
            color: #ffffff;
        }

        .btn-telegram {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #ffffff;
        }

        /* فوتر */
        .footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- بخش آیکون / لوگوی چرخشی -->
    <div class="logo-wrapper">
        <div class="dashed-circle"></div>
        <!-- در صورت تمایل آدرس فایل لوگوی خود را جایگزین کنید -->
        <div class="logo-img" style="background: radial-gradient(circle, #22c55e 0%, #15803d 100%); display:flex; align-items:center; justify-content:center; font-size:2.2rem;">🌾</div>
    </div>

    <!-- عناوین -->
    <h1 class="title">
        <span>🌾</span>
        برنج یار
        <span>🌾</span>
    </h1>
    <div class="subtitle">دستیار هوشمند شالیکاران</div>
    <div class="brand-en">BERANJYAR</div>

    <!-- دکمه‌ها و لینک‌ها -->
    <div class="links-group">
        <!-- ۱. دانلود اپلیکیشن اندروید -->
        <a href="app-release.apk" class="btn-card btn-download" download>
            <span class="arrow">◀</span>
            <div class="btn-content">
                <span class="btn-title">دانلود اپلیکیشن موبایل</span>
                <span class="btn-subtitle">نسخه اندروید - APK</span>
            </div>
            <span class="btn-icon">📱</span>
        </a>

        <!-- ۲. ورود به بازی / وب‌اپلیکیشن -->
        <a href="/game" class="btn-card btn-game">
            <span class="arrow">◀</span>
            <div class="btn-content">
                <span class="btn-title">ورود به بازی</span>
                <span class="btn-subtitle">نسخه وب - بدون نصب</span>
            </div>
            <span class="btn-icon">🎮</span>
        </a>

        <!-- ۳. ربات تلگرام -->
        <a href="https://t.me/berenjyarbot" target="_blank" rel="noopener noreferrer" class="btn-card btn-telegram">
            <span class="arrow">◀</span>
            <div class="btn-content">
                <span class="btn-title">ربات تلگرام</span>
                <span class="btn-subtitle">@berenjyarbot</span>
            </div>
            <span class="btn-icon">🤖</span>
        </a>
    </div>

    <div class="footer">
        © سامانه هوشمند برنج‌یار - مازندران
    </div>
</div>

</body>
</html>
